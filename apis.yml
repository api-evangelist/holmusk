  reason: no-developer-program
  detail: >-
    Holmusk ships NeuroBlu as a hosted analytics product for research teams and markets no API at
    all: neither holmusk.com nor neuroblu.ai contains the word API outside blog prose, /developers
    404s on both, there is no self-serve signup (every call to action is a "Request a demo" form),
    and the only machine-facing host, app.neuroblu.ai, answers every path including /openapi.json
    and /.well-known/agent-card.json with the same 827-byte React shell whose one XHR path
    (/api/rwe/...) is the application's own authenticated internal layer, not an integration surface.
