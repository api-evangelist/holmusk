aid: holmusk
name: Holmusk
description: >-
  Holmusk is a health data science company building real-world evidence (RWE) infrastructure for
  neuropsychiatry and behavioral health. Its flagship product, NeuroBlu, pairs NeuroBlu Data — a
  de-identified, NLP-enriched longitudinal dataset covering 46.5M+ US patients across 20+ years of
  inpatient, outpatient, emergency, crisis and community care — with NeuroBlu Analytics, a hosted
  research platform offering no-code cohort building (Cohort Explorer), Data Explorer, Category
  Mapper and an in-platform R / Python / SQL code studio. Customers are pharma R&D, medical affairs,
  market access/HEOR, payors and health systems. Holmusk is headquartered in Singapore with offices
  in New York, London and Basel, and also ships MindLinc and MAST behavioral-health software. The
  NeuroBlu common data model is being aligned with the OHDSI OMOP Common Data Model. As of this
  profile Holmusk publishes no public developer program, API reference, or machine-readable API
  contract; the platform and its data dictionary are reachable only after a commercial agreement
  and login at app.neuroblu.ai.
