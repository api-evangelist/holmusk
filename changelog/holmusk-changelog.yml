note: >-
  NeuroBlu Analytics publishes a dated, categorised release feed on the product marketing site
  (categories: NEW RELEASE / General / EVENT). It is a product changelog, not an API changelog —
  Holmusk publishes no API, so no breaking-change or deprecation notices appear in it. Two version
  streams run in parallel and both are recorded below: the PLATFORM version (semver-ish vMAJOR.MINOR,
  currently v5.2) and the DATASET release (YYRn, e.g. 26R3), which is the number that actually
  changes what a study returns. Recent window only; the live feed is the source of truth. No RSS or
  JSON feed is offered for this changelog — it is HTML on a Webflow site.
