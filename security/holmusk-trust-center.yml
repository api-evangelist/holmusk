note: >-
  Holmusk does not run a conventional "trust center" (trust.holmusk.com does not resolve;
  holmusk.com/trust, /security and /compliance all return 404). What it does publish — openly,
  with no login — is its full HIPAA compliance policy set at policy.holmusk.com: ~176,000
  characters covering policy management, risk management, roles, data management, system access,
  incident response, breach notification, business continuity, configuration management and
  vulnerability management, each section mapped to the HITRUST Common Security Framework control
  and the HIPAA Security Rule citation it satisfies. That is a stronger public compliance artifact
  than most trust pages, so it is recorded here.
certifications:
- name: HITRUST CSF
  status: claimed
  evidence: >-
    "current production systems on this platform are included in Holmusk's third-party audits and
    HITRUST compliance" — policy.holmusk.com §1.2 Compliance Inheritance. Every policy section
    lists "Applicable Standards from the HITRUST Common Security Framework".
- name: HIPAA / HITECH
  status: claimed
  evidence: >-
    Policy set is structured as HIPAA Security Rule + HITECH Act control mappings
    (e.g. 164.316(b)(1)(i), 13402(a)/(b)); Holmusk operates as a HIPAA business associate for
    customer ePHI.
not_claimed:
